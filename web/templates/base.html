<!doctype html>
<html lang="en" class="">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Rental Finder{% endblock %}</title>

  <!-- Apply theme BEFORE Tailwind/paint to avoid a flash. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("rf-theme");
        if (!t) {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        if (t === "dark") document.documentElement.classList.add("dark");
      } catch (e) { /* ignore */ }
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
  />
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"] },
          colors: {
            ink: { 950: "#0a0e1a", 900: "#0f1424", 800: "#161c30", 700: "#202841" },
            brand: { 50: "#eef4ff", 100: "#dbe5ff", 300: "#a5b4fc", 500: "#5b6dff", 600: "#4f5ee8", 700: "#3f4cc7" },
          },
          boxShadow: {
            card: "0 1px 2px rgba(15,20,36,0.06), 0 8px 24px rgba(15,20,36,0.06)",
            ring: "0 0 0 4px rgba(91,109,255,0.12)",
          },
        },
      },
    };
  </script>
  <style>
    body { font-family: "Inter", ui-sans-serif, system-ui, sans-serif; }
    .skeleton {
      background: linear-gradient(110deg, #ececec 8%, #f5f5f5 18%, #ececec 33%);
      background-size: 200% 100%;
      animation: shimmer 1.4s linear infinite;
    }
    .dark .skeleton {
      background: linear-gradient(110deg, #1f2937 8%, #2a3447 18%, #1f2937 33%);
      background-size: 200% 100%;
    }
    @keyframes shimmer { to { background-position-x: -200%; } }
    .htmx-request .submit-text { display: none; }
    .htmx-request .loading-text { display: inline-flex; }
    .loading-text { display: none; }
    .htmx-request.results-pane { opacity: 0.55; }

    /* Theme toggle: show only the icon for the current theme. */
    .theme-icon-light { display: inline-flex; }
    .theme-icon-dark { display: none; }
    .dark .theme-icon-light { display: none; }
    .dark .theme-icon-dark { display: inline-flex; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased dark:bg-ink-950 dark:text-slate-200 transition-colors">
  {% block body %}{% endblock %}
</body>
</html>
